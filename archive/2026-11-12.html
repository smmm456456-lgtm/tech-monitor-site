<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Monitor 2026-11-12</title>
<style>
:root{
  --navy:#0f1d33; --navy2:#1b2c4a; --line:#d9dee6; --line2:#eef1f5; --bg:#f3f5f8; --card:#fff;
  --tx:#1d2330; --tx2:#5b6474; --tx3:#8a93a3; --link:#1f5fbf;
  --up:#d6202a; --dn:#1f5fd6; --upbg:#fbe3e3; --dnbg:#e2ebfb;
  --mono:"Consolas","D2Coding","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:52px}
body{margin:0;background:var(--bg);color:var(--tx);font:12.5px/1.45 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--tx2)} .na{color:var(--tx3)}
.tri{font-style:normal;font-size:.8em;margin-right:1px}
/* header */
header{position:sticky;top:0;z-index:20;height:44px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;gap:24px}
header .brand{font-weight:700;font-size:14px;letter-spacing:.2px;white-space:nowrap}
header nav{display:flex;gap:2px;flex:1}
header nav a{color:#c9d3e3;padding:12px 12px;font-size:13px;border-bottom:2px solid transparent}
header nav a:hover{color:#fff;text-decoration:none}
header nav a.on{color:#fff;border-bottom-color:#fff;font-weight:600}
header .meta{font-size:11.5px;color:#aab6c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
header nav{flex:1 0 auto} header select{flex:none}
@media (max-width:1099px){header{gap:12px} header .meta .mk{display:none}}
header select{font:12px var(--mono);padding:2px 4px;border-radius:3px;border:1px solid #6d7c95;background:#fff;color:var(--tx)}
/* layout */
.wrap{max-width:1400px;margin:0 auto;padding:10px 12px}
section.sec{margin-bottom:14px}
.sec>h2{margin:0 0 8px;font-size:15px;font-weight:700;border-bottom:2px solid var(--navy);padding:2px 0 4px;display:flex;align-items:baseline;gap:8px}
.sec>h2 small{font-size:11px;font-weight:400;color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:8px 10px;margin-bottom:8px}
.card>h3{margin:0 0 6px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--tx2)} .small{font-size:11px}
.empty{color:var(--tx3);padding:6px 0}
table{border-collapse:collapse;width:100%}
th,td{padding:0 6px;height:26px;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-weight:600;color:var(--tx2);font-size:11.5px;background:#f8f9fb;text-align:center}
td.l,th.l{text-align:left}
tbody tr:hover{background:#f7f9fc}
.scroll-x{overflow-x:auto}
/* index strip */
.idx{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin-bottom:6px}
@media (max-width:1300px){.idx{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ix{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.ix .t{display:flex;justify-content:space-between;font-weight:700;font-size:12px}
.ix .c{font-family:var(--mono);font-size:14px;margin:1px 0 3px}
.ix .g{display:grid;grid-template-columns:repeat(3,1fr);column-gap:4px;font-size:10.5px}
.ix .g span{font-family:var(--mono);text-align:right}
.ix .g b{font-weight:400;color:var(--tx3);text-align:right;font-size:10px}
.ix .d{font-size:10px;color:var(--tx3)}
.ix.small{padding:4px 8px} .ix.small .c{font-size:12px}
/* heat */
.heat{border-collapse:separate;border-spacing:1px;table-layout:fixed}
.heat th,.heat td{border-bottom:0}
/* 스코어카드 + 섹터 표: 나란히 한 줄 (좁은 화면·인쇄는 위아래) */
.duo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}
.duo>.card{margin-bottom:0}
.duo:not(:has(>details:not([open]))){align-items:stretch}  /* 둘 다 펼쳤을 때만 카드 높이를 맞춘다 */
@media (max-width:1250px){.duo{grid-template-columns:minmax(0,1fr)}}
.heat th.sc0{width:110px;background:none}
/* 글자 크기·행 높이는 대표 지수 카드(제목 12px·숫자 10.5~11px·라벨 10px)에 맞춘다 */
.heat th{height:20px;background:none;padding:0 8px;text-align:right;font-size:10px;font-weight:400;color:var(--tx3)}
.heat thead tr:first-child th.grp{text-align:center;font-size:11px;font-weight:700;color:var(--tx);border-bottom:2px solid var(--navy)}
.heat th.gs,.heat td.gs{border-left:6px solid var(--card)}
.heat tbody tr:hover{background:none}
.heat td{height:24px;padding:0 8px}
.heat td.l{font-size:11.5px;font-weight:600}
.heat td.num{font:600 10.5px/1"Segoe UI","Pretendard",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.2px;padding:0 5px;background:#f6f7f9;color:#10151f}
.heat td.na{color:var(--tx3);font-weight:400}
.heat td.u1{background:#fdeeee}.heat td.u2{background:#fbd9d9}.heat td.u3{background:#f6b9b9}.heat td.u4{background:#ef9797}
.heat td.d1{background:#ecf1fd}.heat td.d2{background:#d6e2fa}.heat td.d3{background:#b6ccf5}.heat td.d4{background:#93b4ef}
.heat .ph{visibility:hidden}
/* tabs */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.bar.end{justify-content:flex-end}
/* Calendar */
.calhd{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;font-weight:700}
.calhd button{font:12px var(--mono);border:1px solid var(--line);background:#fff;border-radius:3px;padding:1px 8px;cursor:pointer}
.calhd button:disabled{color:var(--tx3);cursor:default}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.cg>div{background:#fff;min-height:56px;padding:4px 6px}
.cg>div.dw{min-height:0;text-align:center;background:#f8f9fb;color:var(--tx2);font-weight:600;font-size:11.5px}
.cg>div.off{background:#f7f8fa}
.cg>div.cur{box-shadow:inset 0 0 0 2px var(--navy)}
.cg .dn-day{font-family:var(--mono);font-size:12px;color:var(--tx3)}
.cg .has .dn-day{color:var(--tx);font-weight:700}
.cg .lk{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.cg .lk a{border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:11px;background:#f8f9fb}
.cg .lk a:hover{background:var(--navy);color:#fff;border-color:var(--navy);text-decoration:none}
.cg .lk span{padding:0 6px;font-size:11px;color:var(--tx3)}
.cg .ev{font-size:11px;line-height:16px;margin-top:3px}
/* 오늘의 핵심 제목 줄: 당일 발표 일정 */
.dd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:11.5px;font-weight:400}
/* News 대표 종목 */
.stk{white-space:nowrap;font-size:11.5px;font-weight:400;margin-left:5px;padding:0 5px;border-radius:2px;background:#f1f4f8;cursor:help}
.stk b{font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:#fff;padding:2px 8px;border-radius:3px;font-size:11.5px;cursor:pointer;color:var(--tx)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab .cnt{color:var(--tx3);margin-left:3px} .tab.on .cnt{color:#aab6c9}
.sortable th{cursor:pointer;user-select:none} .sortable th.on{background:var(--navy);color:#fff}
.flag{color:#c77700;cursor:help;font-size:10.5px;margin-left:2px}
.badge{display:inline-block;font-size:10px;line-height:15px;padding:0 5px;border-radius:2px;background:#e9edf3;color:var(--tx2);vertical-align:1px;white-space:nowrap}
.badge.plus{background:#fdebc8;color:#8a5a00}
.badge.sec{background:#eef1f5}
.badge.r{background:#d6202a;color:#fff}
.badge.cat{background:#eef2fa;color:#2c4a7c}
.tk{color:var(--link);font-family:var(--mono);font-size:11px}
.iss{border-bottom:1px dotted var(--tx2);cursor:help}
/* 접이식 카드 */
.fold>summary{font-size:12.5px;font-weight:700;cursor:pointer;user-select:none}
.fold[open]>summary{margin-bottom:6px}
/* scorecard: 셀 = 지표를 한 줄로 이어 쓴다 (이름 값 방향) */
/* 톤은 섹터별 국가 등락 표와 같게: 타일형 셀, 국가 머리글 남색 밑줄, 행 이름 세미볼드, 개선·악화 배경 = 섹터 표 2단계 색 */
.sc{border-collapse:separate;border-spacing:1px;table-layout:fixed}
.sc th,.sc td{border-bottom:0}
.sc th{height:30px;background:none;padding:0 8px;vertical-align:bottom}  /* 머리글 높이로 섹터 표(머리글 2줄·6행)와 표 높이를 맞춘다 */
.sc th.rowh{width:78px}
.sc thead th.l{text-align:center;font-size:11px;font-weight:700;color:var(--tx);border-bottom:2px solid var(--navy)}
.sc thead th.l,.sc td:not(.rowh){border-left:6px solid var(--card)}
.sc td{height:22px;padding:0 8px;vertical-align:middle;white-space:nowrap;line-height:16px;background:#f6f7f9}
.sc td.rowh{background:none;font-size:11.5px;font-weight:600}
.sc td.imp{background:#fbd9d9} .sc td.wor{background:#d6e2fa}
.sc .ci{display:inline-block;white-space:nowrap;margin-right:9px;font-size:11px}
.sc .ci a,.sc .ci .nm{color:var(--tx2)}
.sc .ci:first-child a,.sc .ci:first-child .nm{color:var(--tx);font-weight:600}
.sc .ci .v{font-family:"Segoe UI","Pretendard",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.2px;margin-left:4px;color:#10151f}
.sc .ci:first-child .v{font-weight:600} .sc .ci .v .na{font-weight:400}
.sc .ci .ar{margin-left:1px;font-size:9px}
.sc .ci .ar.imp{color:var(--up)} .sc .ci .ar.wor{color:var(--dn)} .sc .ci .ar.neu{color:var(--tx3)}
/* 정책·경제 이슈: 종목 이슈처럼 전체 폭 1열 목록 */
.rows .item{padding:7px 0;border-bottom:1px solid var(--line2)}
.rows .item:last-child{border-bottom:0}
.item .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .h b{font-weight:700;font-size:13px} .item .src{font-size:11px;color:var(--tx2);white-space:nowrap}
section[hidden]{display:none}
.item .sm{margin-top:3px} .item .sm div{margin:1px 0;color:#30384a}
.fn{font-size:10px;vertical-align:super;margin-left:1px}
/* news */
.news .it{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:6px;padding:7px 0;border-bottom:1px solid var(--line2)}
.news .rk{font-family:var(--mono);font-size:14px;color:var(--tx2);text-align:right}
.news .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.news .l1 .tt{font-weight:700;font-size:13px}
.news .l1 .tt .tk{margin-left:5px}
.news .l2{color:#30384a;margin-top:2px}
.news .l2 div{margin:0}
.news .rel{font-size:10.5px;color:var(--tx3);margin-top:1px}
.news .orig{font-size:10.5px;color:var(--tx3)}
.src{font-size:11px;color:var(--tx2);white-space:nowrap}
.hl{margin:0;padding-left:16px} .hl li{margin:1px 0}
/* more: 섹션별 아카이브 화면 */
a.more{font-size:11px;font-weight:400}
.sec>h2 a.back{margin-left:auto}
.grp-d{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--navy);padding:8px 0 2px;border-bottom:1px solid var(--line)}
.grp-d:first-child{padding-top:0}
footer{max-width:1400px;margin:0 auto 20px;padding:0 12px;color:var(--tx3);font-size:11px}
/* 모바일 (폭 767px 이하 화면만). screen으로 한정해 A4 인쇄(폭 약 756px)·데스크톱에는 적용되지 않는다 */
@media screen and (max-width:767px){
  html{scroll-padding-top:82px}
  body{font-size:13px}
  /* 헤더 2줄: 사이트명·날짜 선택 / 메뉴 */
  header{height:auto;flex-wrap:wrap;padding:0 10px;gap:0 8px}
  header .brand{height:40px;display:flex;align-items:center;margin-right:auto}
  header .meta{display:none}  /* 기준일은 날짜 선택 상자에 보인다 */
  header select{order:3;font-size:11.5px}
  header nav{order:4;flex:1 0 100%;border-top:1px solid var(--navy2);justify-content:space-around}
  header nav a{padding:8px 10px;font-size:13px}
  .wrap{padding:8px}
  .card{padding:8px}
  .sec>h2{font-size:15px}
  /* 지수 띠: 2열 */
  .idx{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ix .t{font-size:12.5px}
  .ix .g{font-size:11px}
  /* 매크로 스코어카드: 셀 안 지표를 줄바꿈해 화면 폭에 맞춘다 */
  .sc th.rowh{width:52px}
  .sc th{height:24px;padding:0 4px}
  .sc td{white-space:normal;padding:3px 5px;height:auto;line-height:15px}
  .sc td.rowh{font-size:11px;padding:3px 2px}
  .sc thead th.l,.sc td:not(.rowh){border-left-width:3px}
  .sc .ci{display:block;margin-right:0;white-space:normal}
  .sc .ci .v{display:inline-block}  /* 이름이 길면 값을 다음 줄로 */
  /* 섹터 표·종목 순위: 표는 카드 안에서 가로로 스크롤 */
  .heat{min-width:430px}
  .heat th.sc0{width:84px}
  .heat td,.heat th{padding:0 4px}
  /* 가로 스크롤 때 고정 열: 섹터 표 첫 열(섹터명), 종목 순위 1~2열(순위·종목명) */
  .heat th.sc0,.heat td.l{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:3px 0 3px -2px rgba(15,29,51,.18)}
  .heat td.l{white-space:normal;line-height:13px}
  #rank table{font-size:12px;border-collapse:separate;border-spacing:0}
  #rank th:nth-child(1),#rank td:nth-child(1){position:sticky;left:0;z-index:2;width:26px;min-width:26px;max-width:26px;padding:0 4px}
  #rank th:nth-child(2),#rank td:nth-child(2){position:sticky;left:26px;z-index:2;min-width:96px;max-width:118px;white-space:normal;line-height:14px;
    box-shadow:3px 0 3px -2px rgba(15,29,51,.18)}
  #rank td:nth-child(1),#rank td:nth-child(2){background:var(--card)}
  #rank th:nth-child(1),#rank th:nth-child(2){background:#f8f9fb}
  #rank th.on:nth-child(2){background:var(--navy)}
  #rank tbody tr:hover td:nth-child(-n+2){background:#f7f9fc}
  #rank td:nth-child(2) .badge{display:none}  /* 태그 섹터 배지는 고정 열 폭을 위해 숨긴다 */
  #rank td[colspan]{position:static;max-width:none}
  .scroll-x{-webkit-overflow-scrolling:touch}
  .tab{padding:4px 9px;font-size:12px}
  /* 뉴스·정책·경제 이슈: 제목 아래에 매체·게시일 */
  .news .l1,.item .h{flex-direction:column;gap:2px;align-items:flex-start}
  .news .l1 .src,.item .src{white-space:normal}
  .news .it{grid-template-columns:18px minmax(0,1fr)}
  .item .h b,.news .l1 .tt{font-size:13.5px}
  .stk{margin-left:0}
  /* Calendar: 칸을 좁게, 일정은 작은 글씨로 줄바꿈 */
  .cg>div{min-height:48px;padding:2px 3px}
  .cg .ev{font-size:10px;line-height:13px;word-break:keep-all;overflow-wrap:anywhere}
  .cg .lk{gap:2px}
  .cg .lk a,.cg .lk span{padding:0 3px;font-size:10px}
  .cg>div.dw{font-size:11px}
}
/* 인쇄: A4 세로, 여백 최소. 화면 배치를 그대로 축소한다 */
@page{size:A4 portrait;margin:5mm}
@media print{
  .iss{border-bottom:0}
  a.more{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;zoom:.75}
  header{position:static;height:30px;padding:0 8px}
  header nav,header select{display:none}
  header .brand{margin-right:auto}
  header .meta .mk{display:inline}
  .wrap{max-width:none;padding:6px 0 0}
  section.sec{margin-bottom:6px}
  .idx{grid-template-columns:repeat(9,minmax(0,1fr))}
  .duo{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}  /* 화면과 같은 나란히 배치 */
  .duo .scroll-x{zoom:.84}  /* A4 폭에 맞게 표만 살짝 축소 (카드 제목·여백은 다른 카드와 같게) */
  .scroll-x{overflow:visible}
  #rank td[style]{min-width:150px!important}
  .ix,.item,.news .it,tr,summary{break-inside:avoid}
  .sec>h2,.card>h3,.fold>summary{break-after:avoid}
  footer{max-width:none;margin:0;padding:0}
}
</style>
</head>
<body>
<header>
  <div class="brand">Tech Monitor</div>
  <nav id="nav"><a href="#main" class="on">Main</a><a href="#news">News</a><a href="#calendar">Calendar</a></nav>
  <div class="meta" id="hmeta"></div>
  <select id="datesel" aria-label="날짜 선택"></select>
</header>
<div class="wrap">
  <main>
    <section class="sec" id="main"><h2>Main</h2>
      <div id="headline"></div>
      <div id="idx"></div>
      <div class="duo">
        <details class="card fold" open><summary>매크로 스코어카드</summary><div class="scroll-x" id="score"></div></details>
        <details class="card fold" open><summary>섹터별 국가 등락</summary><div class="scroll-x" id="heat"></div></details>
      </div>
      <div class="card"><div class="bar"><div class="tabs" id="sectabs"></div><div class="tabs" id="ctyabs"></div></div><div class="scroll-x" id="rank"></div></div>
    </section>
    <section class="sec" id="news"><h2>News</h2>
      <div class="card"><h3>인사이트·전망</h3><div id="insights"></div></div>
      <div class="card"><h3><span>정책 트래커</span><a class="more" href="#more-policy">more</a></h3><div class="rows" id="policy"></div></div>
      <div class="card"><h3><span>경제 이슈</span><a class="more" href="#more-econ">more</a></h3><div class="rows" id="econ"></div></div>
      <div class="bar end"><div class="tabs" id="nfc"></div></div>
      <div class="card news"><h3><span>종목 이슈</span><a class="more" href="#more-stock">more</a></h3><div id="top10"></div></div>
    </section>
    <section class="sec" id="more" hidden><h2><span><span id="moretitle"></span> 아카이브</span><a class="more back" href="#news">닫기</a></h2>
      <div class="bar end"><div class="tabs" id="mfc"></div></div>
      <div class="card" id="morebox"></div>
    </section>
    <section class="sec" id="calendar" hidden><h2>Calendar</h2>
      <div class="card"><div id="calbox"></div></div>
    </section>
  </main>

,"category":"earnings","category_ko":"실적·가이던스","id":"8285e0133affa4e5","title":"NAVER IR - 연결재무제표기준영업(잠정)실적(공정공시)","url":"https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261112800027","media":"DART","published_local":"2026-11-12 08:05 Seoul","published_kst":"2026-11-12 08:05 KST","published_utc":"2026-11-11T23:05:00+00:00","paywall":false,"kind":"filing","tickers":["035420.KS"],"names":["NAVER"],"sectors":["internet"],"title_ko":"네이버, 3분기 매출 3조4,724억원 분기 최대·영업익 20.9%↓…AI 팩토리 2조원 공급계약","summary":["네이버의 3분기 연결 매출은 3조4,724억원으로 10.7% 늘어 분기 최대였지만, 영업이익은 4,513억원으로 20.9%, 순이익은 4,025억원으로 45.2% 줄었다.","AI 인프라·콘텐츠 투자가 늘었고, 미국 AI 추론 기업과 약 2조원 규모의 AI 팩토리 컴퓨팅 서비스 공급 계약을 맺어 첫 고객을 확보했다.","AI 팩토리 매출은 내년 상반기부터 반영될 예정이며, 1단계 목표 200MW 중 남은 약 180MW를 놓고 10곳 넘는 기업과 추가 계약을 논의하고 있다."],"basis":"filing","related":[{"media":"연합뉴스","url":"https://www.yna.co.kr/view/AKR20261112025452527"},{"media":"DART","url":"https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261112800028"},{"media":"한국경제","url":"https://www.hankyung.com/article/202611122906i"}]},{"rank":4,"category":"earnings","category_ko":"실적·가이던스","id":"828876eee4d4d9e0","title":"DB하이텍 - 연결재무제표기준영업(잠정)실적(공정공시)","url":"https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261112800091","media":"DART","published_local":"2026-11-12 08:32 Seoul","published_kst":"2026-11-12 08:32 KST","published_utc":"2026-11-11T23:32:00+00:00","paywall":false,"kind":"filing","tickers":["000990.KS"],"names":["DB하이텍"],"sectors":["semi_chip"],"title_ko":"DB하이텍, 3분기 영업이익 900억원 7%↑…전력반도체 수요로 가동률 사실상 100%","summary":["DB하이텍의 3분기 매출은 4,034억원, 영업이익은 900억원으로 각각 14%, 7% 늘었고 영업이익률은 22%였다.","주력 전력반도체 수요가 이어져 공장 가동률이 사실상 100%였고, 고전압 전력반도체 비중 확대로 판매단가도 올랐다.","3분기 누적 매출·영업이익은 1조1,774억원·2,622억원으로 19%·24% 늘었으며, 음성 상우캠퍼스 클린룸을 완공해 월 4만장 생산능력을 더할 계획이다."],"basis":"filing","related":[{"media":"매일경제","url":"https://www.mk.co.kr/news/business/12206280"},{"media":"매일경제","url":"https://www.mk.co.kr/news/business/12206623"},{"media":"한국경제","url":"https://www.hankyung.com/article/2026111219086"}]},{ ","source":"과학기술정보통신부"},{"date":"2026-11-06","country":"KR","type":"tariff","title":"대외경제장관회의, 미 중간선거 후 통상·산업 정책 변화 점검","summary":["제276차 대외경제장관회의에서 정부는 미국 중간선거 이후 관세·수출통제 등 행정부의 통상 조치와 의회의 산업 지원 정책 변화가 우리 기업에 미칠 영향을 선제적으로 점검하겠다고 밝혔다.","기존 한미 무역합의를 안정적으로 이행하고 미국 행정부·의회·주정부와 소통을 강화해 조선·에너지 등 전략산업 협력 기회를 발굴하기로 했다."],"url":"https://www.mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000079883&menuNo=4010100","type_ko":"관세","source":"재정경제부"},{"date":"2026-10-28","country":"US","type":"monetary","title":"FOMC, 연방기금금리 3.75~4.00% 동결","summary":["연방공개시장위원회가 연방기금금리 목표 범위를 3.75~4.00%로 유지했으며 표결은 10대 2였다.","쿡·해맥 위원은 0.25%p 인상을 주장하며 반대했고, 성명은 인플레이션이 여전히 높다고 평가했다."],"url":"https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a.htm","type_ko":"통화","source":"Federal Reserve"},{"date":"2026-10-22","country":"KR","type":"monetary","title":"한은 금통위, 기준금리 3.00% 유지","summary":["한국은행 금융통화위원회가 기준금리를 3.00%로 유지했으며, 대내외 위험요인의 전개상황과 두 차례 인상의 파급영향을 점검할 필요가 있다고 판단했다.","금년과 내년 성장률은 8월 전망치(3.3%, 2.9%)를 상당폭 상회하고, 내년 소비자물가·근원물가 상승률은 기존 전망치(2.3%, 2.5%)를 웃돌 것으로 예상했다."],"url":"https://www.bok.or.kr/portal/bbs/P0000559/view.do?nttId=11065823&menuNo=200690","type_ko":"통화","source":"한국은행"}],"econ_issues":[{"id":"405b0766fc54f98a","title":"高通CEO谈科技股暴跌：对我们而言“不存在AI板块回调”","url":"https://finance.sina.com.cn/stock/usstock/c/2026-11-12/doc-iniynyav1640436.shtml","media":"新浪财经","published_local":"2026-11-12 23:05 Shanghai","published_kst":"2026-11-13 00:05 KST","published_utc":"2026-11-12T15:05:44+00:00","paywall":false,"kind":"news","tickers":["QCOM"],"names":["퀄컴"],"sectors":["semi_chip"],"title_ko":"퀄컴 CEO \"반도체 업계 웨이퍼·기판·패키징 모두 부족…AI 조정 우리와 무관\"","summary":["퀄컴의 크리스티아누 아몬 CEO는 AI 관련주 급락에 대해 퀄컴은 데이터센터 사업을 막 시작해 'AI 조정'이 해당되지 않는다고 말했다.","그는 반도체 업계가 웨이퍼·기판·패키징 생산능력이 모두 부족할 만큼 수요가 강하고, 에너지 설비 공급 기간이 연산 장비보다 길어 실제 구축 속도와 시장 기대 사이에 차이가 있을 수 있다고 지적했다.","퀄컴은 지난 9월 장기 계약에 따라 아마존이 최대 600억달러어치의 AI 데이터센터 칩과 관련 제품을 살 수 있다고 밝힌 바 있다."],"basis":"body","relate <script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("tm-data").textContent);
const S = D.sectors, SN = Object.fromEntries(S.map(s => [s.key, s.name]));
const BN = {KR:"한국", US:"미국", CN:"중국"};
const MK = {KR:"한국", US:"미국", CN:"중국", HK:"홍콩"};
const CK = {US:"미국", KR:"한국", CN:"중국", GLOBAL:"글로벌"};
const PER = ["1D","1W","1M","3M","6M","1Y","YTD"], PERL = {"1Y":"YoY"};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const href = u => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
const link = (u, t) => `<a href="${href(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`;
const cls = v => v == null ? "na" : v > 0 ? "up" : v < 0 ? "dn" : "flat";
const tri = v => v > 0 ? "▲" : v < 0 ? "▼" : "";
const pct = (v, d=2) => v == null ? '<span class="na">N/A</span>' : `<span class="${cls(v)}"><i class="tri">${tri(v)}</i>${Math.abs(v).toFixed(d)}</span>`;
const fnum = (v, d) => v == null ? "N/A" : v.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const mm = s => s ? s.slice(5, 10) : "―";
const empty = t => `<div class="empty">${esc(t)}</div>`;
const mcap = v => v == null ? '<span class="na">N/A</span>' : v >= 1000 ? `$${(v/1000).toFixed(2)}T` : `$${v.toFixed(v >= 100 ? 0 : 1)}B`;

const bd = M ? M.base_dates : {};

const dates = (window.TM_DATES || [D.as_of]);

$("datesel").onchange = e => { location.href = "" + e.target.value + ".html"; };

/* headline: 3문장, 제목 줄 오른쪽에 D-day(발행일) 발표 일정 */
const EVENTS = window.TM_EVENTS || [];
const evLink = e => `<span class="badge">${esc(CK[e.country] || e.country)}</span> ${e.source_url ? link(e.source_url, esc(e.name)) : esc(e.name)}`;
const dday = EVENTS.filter(e => e.date === D.ref_date);

const hl = D.headline || [];
if (hl.length || ddHtml) {
  $("headline").innerHTML = `<div class="card"><h3><span>오늘의 핵심</span>${ddHtml}</h3>` + (hl.length ? `<ol class="hl">` +
    hl.map(h => `<li>${esc(h.text)}${(h.refs||[]).map((u,i)=>`<a class="fn" href="${href(u)}" target="_blank" rel="noopener noreferrer">[${i+1}]</a>`).join("")}</li>`).join("") + `</ol>` : "") + `</div>`;
}

/* index strip */
const IDX_SHOW = ["KOSPI","KOSDAQ","SPX","NASDAQ","RUT","CSI300","SSE","HSI","HSTECH"];  // 과거 파일의 NYSE·SOX는 표시하지 않는다
function ixCard(i, small) {
  const g = ["1W","1M","3M","6M","1Y","YTD"].map(k => `<b>${PERL[k]||k}</b>`).slice(0,3).join("") +
    ["1W","1M","3M"].map(k => `<span>${pct(i.ret[k],1)}</span>`).join("") +
    ["6M","1Y","YTD"].map(k => `<b>${PERL[k]||k}</b>`).join("") + ["6M","1Y","YTD"].map(k => `<span>${pct(i.ret[k],1)}</span>`).join("");

  return `<div class="ix${small?" small":""}"><div class="t"><span>${esc(i.name)}${st}</span><span class="num">${pct(i.ret["1D"])}</span></div>` +
    `<div class="c">${fnum(i.close, 2)}</div>` + (small ? "" : `<div class="g">${g}</div>`) + `<div class="d">${i.stale ? `종가 ${esc(i.last_date)} · 기준일 ${esc(i.base_date)} 데이터 없음` : `기준 ${esc(i.base_date || "N/A")}`}</div></div>`;
}

    const base = "" + d + ".html";
    h += `<div class="${has ? "has" : ""}${d === D.as_of ? " cur" : ""}"><span class="dn-day">${i}</span>` +
      (has ? `<div class="lk"><a href="${base}#main">Main</a>${hasNews(d) ? `<a href="${base}#news">News</a>` : "<span>News 없음</span>"}</div>` : "") +
      EVENTS.filter(e => e.date === d).map(e => `<div class="ev">${evLink(e)}</div>`).join("") + `</div>`;
  }
  $("calbox").innerHTML = h + `<div class="off"></div>`.repeat((7 - (first + days) % 7) % 7) + "</div>";
  $("calprev").onclick = () => { calYm--; renderCalendar(); };
  $("calnext").onclick = () => { calYm++; renderCalendar(); };
}
renderCalendar();

/* 화면 전환: #calendar면 달력만, #more-<섹션>이면 그 섹션 아카이브만, 그 외에는 Main·News 스크롤 화면 */
const secs = ["main","news"].map(id => $(id)), navs = [...document.querySelectorAll("#nav a")];
const isCal = () => location.hash === "#calendar";
const moreKind = () => (location.hash.match(/^#more-(policy|econ|stock)$/) || [])[1];
function markNav(cur) { navs.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur)); }
function spy() {
  if (isCal()) return markNav("calendar");
  if (moreKind()) return markNav("news");
  let cur = "main";
  for (const s of secs) if (s.getBoundingClientRect().top <= 80) cur = s.id;
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) cur = "news";
  markNav(cur);
}
let wasCal = false;
function applyView(first) {
  const kind = moreKind(), cal = isCal() || !!kind;  // cal = 본문 대신 별도 화면
  secs.forEach(s => s.hidden = cal);
  $("calendar").hidden = !isCal();
  $("more").hidden = !kind;
  if (kind) { mC = "ALL"; renderMore(kind); }
  if (cal) window.scrollTo({top: 0, behavior: "instant"});
  else if ((first || wasCal) && /^#(main|news)$/.test(location.hash)) {
    // 화면을 스크립트로 그리거나 숨김을 푼 직후라 브라우저의 앵커 이동이 어긋난다 → 위치를 다시 맞춘다
    $(location.hash.slice(1)).scrollIntoView({behavior: "instant"});
  }
  wasCal = cal;
  spy();
}
if (new URLSearchParams(location.search).has("pdf")) {  // PDF 저장용: 카드는 화면 기본(펼침·나란히), 종목 순위 전체/통합
  curCty = "ALL";
  setSec("all");
}
addEventListener("scroll", spy, {passive: true});
addEventListener("hashchange", () => applyView(false));
applyView(true);
})();
</script>
</body>
