<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Monitor 2026-11-10</title>
<style>
:root{
  --navy:#0f1d33; --navy2:#1b2c4a; --line:#d9dee6; --line2:#eef1f5; --bg:#f3f5f8; --card:#fff;
  --tx:#1d2330; --tx2:#5b6474; --tx3:#8a93a3; --link:#1f5fbf;
  --up:#d6202a; --dn:#1f5fd6; --upbg:#fbe3e3; --dnbg:#e2ebfb;
  --mono:"Consolas","D2Coding","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:52px}
body{margin:0;background:var(--bg);color:var(--tx);font:12.5px/1.45 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--tx2)} .na{color:var(--tx3)}
.tri{font-style:normal;font-size:.8em;margin-right:1px}
/* header */
header{position:sticky;top:0;z-index:20;height:44px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;gap:24px}
header .brand{font-weight:700;font-size:14px;letter-spacing:.2px;white-space:nowrap}
header nav{display:flex;gap:2px;flex:1}
header nav a{color:#c9d3e3;padding:12px 12px;font-size:13px;border-bottom:2px solid transparent}
header nav a:hover{color:#fff;text-decoration:none}
header nav a.on{color:#fff;border-bottom-color:#fff;font-weight:600}
header .meta{font-size:11.5px;color:#aab6c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
header nav{flex:1 0 auto} header select{flex:none}
@media (max-width:1099px){header{gap:12px} header .meta .mk{display:none}}
header select{font:12px var(--mono);padding:2px 4px;border-radius:3px;border:1px solid #6d7c95;background:#fff;color:var(--tx)}
/* layout */
.wrap{max-width:1400px;margin:0 auto;padding:10px 12px}
section.sec{margin-bottom:14px}
.sec>h2{margin:0 0 8px;font-size:15px;font-weight:700;border-bottom:2px solid var(--navy);padding:2px 0 4px;display:flex;align-items:baseline;gap:8px}
.sec>h2 small{font-size:11px;font-weight:400;color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:8px 10px;margin-bottom:8px}
.card>h3{margin:0 0 6px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--tx2)} .small{font-size:11px}
.empty{color:var(--tx3);padding:6px 0}
table{border-collapse:collapse;width:100%}
th,td{padding:0 6px;height:26px;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-weight:600;color:var(--tx2);font-size:11.5px;background:#f8f9fb;text-align:center}
td.l,th.l{text-align:left}
tbody tr:hover{background:#f7f9fc}
.scroll-x{overflow-x:auto}
/* index strip */
.idx{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin-bottom:6px}
@media (max-width:1300px){.idx{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ix{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.ix .t{display:flex;justify-content:space-between;font-weight:700;font-size:12px}
.ix .c{font-family:var(--mono);font-size:14px;margin:1px 0 3px}
.ix .g{display:grid;grid-template-columns:repeat(3,1fr);column-gap:4px;font-size:10.5px}
.ix .g span{font-family:var(--mono);text-align:right}
.ix .g b{font-weight:400;color:var(--tx3);text-align:right;font-size:10px}
.ix .d{font-size:10px;color:var(--tx3)}
.ix.small{padding:4px 8px} .ix.small .c{font-size:12px}
/* heat */
.heat{border-collapse:separate;border-spacing:1px;table-layout:fixed}
.heat th,.heat td{border-bottom:0}
/* 스코어카드 + 섹터 표: 나란히 한 줄 (좁은 화면·인쇄는 위아래) */
.duo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}
.duo>.card{margin-bottom:0}
.duo:not(:has(>details:not([open]))){align-items:stretch}  /* 둘 다 펼쳤을 때만 카드 높이를 맞춘다 */
@media (max-width:1250px){.duo{grid-template-columns:minmax(0,1fr)}}
.heat th.sc0{width:110px;background:none}
/* 글자 크기·행 높이는 대표 지수 카드(제목 12px·숫자 10.5~11px·라벨 10px)에 맞춘다 */
.heat th{height:20px;background:none;padding:0 8px;text-align:right;font-size:10px;font-weight:400;color:var(--tx3)}
.heat thead tr:first-child th.grp{text-align:center;font-size:11px;font-weight:700;color:var(--tx);border-bottom:2px solid var(--navy)}
.heat th.gs,.heat td.gs{border-left:6px solid var(--card)}
.heat tbody tr:hover{background:none}
.heat td{height:24px;padding:0 8px}
.heat td.l{font-size:11.5px;font-weight:600}
.heat td.num{font:600 10.5px/1"Segoe UI","Pretendard",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.2px;padding:0 5px;background:#f6f7f9;color:#10151f}
.heat td.na{color:var(--tx3);font-weight:400}
.heat td.u1{background:#fdeeee}.heat td.u2{background:#fbd9d9}.heat td.u3{background:#f6b9b9}.heat td.u4{background:#ef9797}
.heat td.d1{background:#ecf1fd}.heat td.d2{background:#d6e2fa}.heat td.d3{background:#b6ccf5}.heat td.d4{background:#93b4ef}
.heat .ph{visibility:hidden}
/* tabs */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.bar.end{justify-content:flex-end}
/* Calendar */
.calhd{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;font-weight:700}
.calhd button{font:12px var(--mono);border:1px solid var(--line);background:#fff;border-radius:3px;padding:1px 8px;cursor:pointer}
.calhd button:disabled{color:var(--tx3);cursor:default}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.cg>div{background:#fff;min-height:56px;padding:4px 6px}
.cg>div.dw{min-height:0;text-align:center;background:#f8f9fb;color:var(--tx2);font-weight:600;font-size:11.5px}
.cg>div.off{background:#f7f8fa}
.cg>div.cur{box-shadow:inset 0 0 0 2px var(--navy)}
.cg .dn-day{font-family:var(--mono);font-size:12px;color:var(--tx3)}
.cg .has .dn-day{color:var(--tx);font-weight:700}
.cg .lk{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.cg .lk a{border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:11px;background:#f8f9fb}
.cg .lk a:hover{background:var(--navy);color:#fff;border-color:var(--navy);text-decoration:none}
.cg .lk span{padding:0 6px;font-size:11px;color:var(--tx3)}
.cg .ev{font-size:11px;line-height:16px;margin-top:3px}
/* 오늘의 핵심 제목 줄: 당일 발표 일정 */
.dd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:11.5px;font-weight:400}
/* News 대표 종목 */
.stk{white-space:nowrap;font-size:11.5px;font-weight:400;margin-left:5px;padding:0 5px;border-radius:2px;background:#f1f4f8;cursor:help}
.stk b{font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:#fff;padding:2px 8px;border-radius:3px;font-size:11.5px;cursor:pointer;color:var(--tx)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab .cnt{color:var(--tx3);margin-left:3px} .tab.on .cnt{color:#aab6c9}
.sortable th{cursor:pointer;user-select:none} .sortable th.on{background:var(--navy);color:#fff}
.flag{color:#c77700;cursor:help;font-size:10.5px;margin-left:2px}
.badge{display:inline-block;font-size:10px;line-height:15px;padding:0 5px;border-radius:2px;background:#e9edf3;color:var(--tx2);vertical-align:1px;white-space:nowrap}
.badge.plus{background:#fdebc8;color:#8a5a00}
.badge.sec{background:#eef1f5}
.badge.r{background:#d6202a;color:#fff}
.badge.cat{background:#eef2fa;color:#2c4a7c}
.tk{color:var(--link);font-family:var(--mono);font-size:11px}
.iss{border-bottom:1px dotted var(--tx2);cursor:help}
/* 접이식 카드 */
.fold>summary{font-size:12.5px;font-weight:700;cursor:pointer;user-select:none}
.fold[open]>summary{margin-bottom:6px}
/* scorecard: 셀 = 지표를 한 줄로 이어 쓴다 (이름 값 방향) */
/* 톤은 섹터별 국가 등락 표와 같게: 타일형 셀, 국가 머리글 남색 밑줄, 행 이름 세미볼드, 개선·악화 배경 = 섹터 표 2단계 색 */
.sc{border-collapse:separate;border-spacing:1px;table-layout:fixed}
.sc th,.sc td{border-bottom:0}
.sc th{height:30px;background:none;padding:0 8px;vertical-align:bottom}  /* 머리글 높이로 섹터 표(머리글 2줄·6행)와 표 높이를 맞춘다 */
.sc th.rowh{width:78px}
.sc thead th.l{text-align:center;font-size:11px;font-weight:700;color:var(--tx);border-bottom:2px solid var(--navy)}
.sc thead th.l,.sc td:not(.rowh){border-left:6px solid var(--card)}
.sc td{height:22px;padding:0 8px;vertical-align:middle;white-space:nowrap;line-height:16px;background:#f6f7f9}
.sc td.rowh{background:none;font-size:11.5px;font-weight:600}
.sc td.imp{background:#fbd9d9} .sc td.wor{background:#d6e2fa}
.sc .ci{display:inline-block;white-space:nowrap;margin-right:9px;font-size:11px}
.sc .ci a,.sc .ci .nm{color:var(--tx2)}
.sc .ci:first-child a,.sc .ci:first-child .nm{color:var(--tx);font-weight:600}
.sc .ci .v{font-family:"Segoe UI","Pretendard",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.2px;margin-left:4px;color:#10151f}
.sc .ci:first-child .v{font-weight:600} .sc .ci .v .na{font-weight:400}
.sc .ci .ar{margin-left:1px;font-size:9px}
.sc .ci .ar.imp{color:var(--up)} .sc .ci .ar.wor{color:var(--dn)} .sc .ci .ar.neu{color:var(--tx3)}
/* 정책·경제 이슈: 종목 이슈처럼 전체 폭 1열 목록 */
.rows .item{padding:7px 0;border-bottom:1px solid var(--line2)}
.rows .item:last-child{border-bottom:0}
.item .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .h b{font-weight:700;font-size:13px} .item .src{font-size:11px;color:var(--tx2);white-space:nowrap}
section[hidden]{display:none}
.item .sm{margin-top:3px} .item .sm div{margin:1px 0;color:#30384a}
.fn{font-size:10px;vertical-align:super;margin-left:1px}
/* news */
.news .it{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:6px;padding:7px 0;border-bottom:1px solid var(--line2)}
.news .rk{font-family:var(--mono);font-size:14px;color:var(--tx2);text-align:right}
.news .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.news .l1 .tt{font-weight:700;font-size:13px}
.news .l1 .tt .tk{margin-left:5px}
.news .l2{color:#30384a;margin-top:2px}
.news .l2 div{margin:0}
.news .rel{font-size:10.5px;color:var(--tx3);margin-top:1px}
.news .orig{font-size:10.5px;color:var(--tx3)}
.src{font-size:11px;color:var(--tx2);white-space:nowrap}
.hl{margin:0;padding-left:16px} .hl li{margin:1px 0}
/* more: 섹션별 아카이브 화면 */
a.more{font-size:11px;font-weight:400}
.sec>h2 a.back{margin-left:auto}
.grp-d{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--navy);padding:8px 0 2px;border-bottom:1px solid var(--line)}
.grp-d:first-child{padding-top:0}
footer{max-width:1400px;margin:0 auto 20px;padding:0 12px;color:var(--tx3);font-size:11px}
/* 모바일 (폭 767px 이하 화면만). screen으로 한정해 A4 인쇄(폭 약 756px)·데스크톱에는 적용되지 않는다 */
@media screen and (max-width:767px){
  html{scroll-padding-top:82px}
  body{font-size:13px}
  /* 헤더 2줄: 사이트명·날짜 선택 / 메뉴 */
  header{height:auto;flex-wrap:wrap;padding:0 10px;gap:0 8px}
  header .brand{height:40px;display:flex;align-items:center;margin-right:auto}
  header .meta{display:none}  /* 기준일은 날짜 선택 상자에 보인다 */
  header select{order:3;font-size:11.5px}
  header nav{order:4;flex:1 0 100%;border-top:1px solid var(--navy2);justify-content:space-around}
  header nav a{padding:8px 10px;font-size:13px}
  .wrap{padding:8px}
  .card{padding:8px}
  .sec>h2{font-size:15px}
  /* 지수 띠: 2열 */
  .idx{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ix .t{font-size:12.5px}
  .ix .g{font-size:11px}
  /* 매크로 스코어카드: 셀 안 지표를 줄바꿈해 화면 폭에 맞춘다 */
  .sc th.rowh{width:52px}
  .sc th{height:24px;padding:0 4px}
  .sc td{white-space:normal;padding:3px 5px;height:auto;line-height:15px}
  .sc td.rowh{font-size:11px;padding:3px 2px}
  .sc thead th.l,.sc td:not(.rowh){border-left-width:3px}
  .sc .ci{display:block;margin-right:0;white-space:normal}
  .sc .ci .v{display:inline-block}  /* 이름이 길면 값을 다음 줄로 */
  /* 섹터 표·종목 순위: 표는 카드 안에서 가로로 스크롤 */
  .heat{min-width:430px}
  .heat th.sc0{width:84px}
  .heat td,.heat th{padding:0 4px}
  #rank table{font-size:12px}
  .scroll-x{-webkit-overflow-scrolling:touch}
  .tab{padding:4px 9px;font-size:12px}
  /* 뉴스·정책·경제 이슈: 제목 아래에 매체·게시일 */
  .news .l1,.item .h{flex-direction:column;gap:2px;align-items:flex-start}
  .news .l1 .src,.item .src{white-space:normal}
  .news .it{grid-template-columns:18px minmax(0,1fr)}
  .item .h b,.news .l1 .tt{font-size:13.5px}
  .stk{margin-left:0}
  /* Calendar: 칸을 좁게, 일정은 작은 글씨로 줄바꿈 */
  .cg>div{min-height:48px;padding:2px 3px}
  .cg .ev{font-size:10px;line-height:13px;word-break:keep-all;overflow-wrap:anywhere}
  .cg .lk{gap:2px}
  .cg .lk a,.cg .lk span{padding:0 3px;font-size:10px}
  .cg>div.dw{font-size:11px}
}
/* 인쇄: A4 세로, 여백 최소. 화면 배치를 그대로 축소한다 */
@page{size:A4 portrait;margin:5mm}
@media print{
  .iss{border-bottom:0}
  a.more{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;zoom:.75}
  header{position:static;height:30px;padding:0 8px}
  header nav,header select{display:none}
  header .brand{margin-right:auto}
  header .meta .mk{display:inline}
  .wrap{max-width:none;padding:6px 0 0}
  section.sec{margin-bottom:6px}
  .idx{grid-template-columns:repeat(9,minmax(0,1fr))}
  .duo{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}  /* 화면과 같은 나란히 배치 */
  .duo .scroll-x{zoom:.84}  /* A4 폭에 맞게 표만 살짝 축소 (카드 제목·여백은 다른 카드와 같게) */
  .scroll-x{overflow:visible}
  #rank td[style]{min-width:150px!important}
  .ix,.item,.news .it,tr,summary{break-inside:avoid}
  .sec>h2,.card>h3,.fold>summary{break-after:avoid}
  footer{max-width:none;margin:0;padding:0}
}
</style>
</head>
<body>
<header>
  <div class="brand">Tech Monitor</div>
  <nav id="nav"><a href="#main" class="on">Main</a><a href="#news">News</a><a href="#calendar">Calendar</a></nav>
  <div class="meta" id="hmeta"></div>
  <select id="datesel" aria-label="날짜 선택"></select>
</header>
<div class="wrap">
  <main>
    <section class="sec" id="main"><h2>Main</h2>
      <div id="headline"></div>
      <div id="idx"></div>
      <div class="duo">
        <details class="card fold" open><summary>매크로 스코어카드</summary><div class="scroll-x" id="score"></div></details>
        <details class="card fold" open><summary>섹터별 국가 등락</summary><div class="scroll-x" id="heat"></div></details>
      </div>
      <div class="card"><div class="bar"><div class="tabs" id="sectabs"></div><div class="tabs" id="ctyabs"></div></div><div class="scroll-x" id="rank"></div></div>
    </section>
    <section class="sec" id="news"><h2>News</h2>
      <div class="card"><h3>인사이트·전망</h3><div id="insights"></div></div>
      <div class="card"><h3><span>정책 트래커</span><a class="more" href="#more-policy">more</a></h3><div class="rows" id="policy"></div></div>
      <div class="card"><h3><span>경제 이슈</span><a class="more" href="#more-econ">more</a></h3><div class="rows" id="econ"></div></div>
      <div class="bar end"><div class="tabs" id="nfc"></div></div>
      <div class="card news"><h3><span>종목 이슈</span><a class="more" href="#more-stock">more</a></h3><div id="top10"></div></div>
    </section>
    <section class="sec" id="more" hidden><h2><span><span id="moretitle"></span> 아카이브</span><a class="more back" href="#news">닫기</a></h2>
      <div class="bar end"><div class="tabs" id="mfc"></div></div>
      <div class="card" id="morebox"></div>
    </section>
    <section class="sec" id="calendar" hidden><h2>Calendar</h2>
      <div class="card"><div id="calbox"></div></div>
    </section>
  </main>

","published_kst":"2026-11-10 15:42 KST","published_utc":"2026-11-10T06:42:00+00:00","paywall":false,"kind":"filing","tickers":["259960.KS"],"names":["크래프톤"],"sectors":["internet"],"title_ko":"크래프톤, 3분기 매출 9,714억원 역대 최대…영업이익 2,250억원 35.5%↓·순손실 전환","summary":["크래프톤의 3분기 연결 매출은 9,714억원으로 11.6% 늘어 분기 최대였지만, 영업이익은 2,250억원으로 35.5% 줄었고 684억원 순손실로 돌아섰다.","PC 매출이 2,389억원으로 32.5% 줄었는데, 지난해 3분기 대형 컬래버 업데이트가 올해는 4분기에 몰린 탓이며, ADK그룹 인수로 영업비용은 7,464억원으로 43% 늘었다.","3분기 누적 매출은 3조6,330억원(+51%), 영업이익은 1조1,975억원(+14%)이고, 회사는 데드넷 등 신작 5종의 내년 출시와 연간 두 자릿수 성장을 예상했다."],"basis":"filing","related":[{"media":"연합뉴스","url":"https://www.yna.co.kr/view/AKR20261110134152527"},{"media":"연합뉴스","url":"https://www.yna.co.kr/view/AKR20261110134151527"},{"media":"한국경제","url":"https://www.hankyung.com/article/2026111188576"}]},{"rank":2,"category":"earnings","category_ko":"실적·가이던스","id":"ad3139c10bec0768","title":"앰프리우스(AMPX): 8-K - Current report","url":"https://www.sec.gov/Archives/edgar/data/1899287/000189928726000069/0001899287-26-000069-index.htm","media":"SEC EDGAR","published_local":"2026-11-10 16:28 New_York","published_kst":"2026-11-11 06:28 KST","published_utc":"2026-11-10T21:28:59+00:00","paywall":false,"kind":"filing","tickers":["AMPX"],"names":["앰프리우스"],"sectors":["battery_ev"],"title_ko":"앰프리우스, 3분기 매출 3,910만달러 83%↑ 사상 최대…연간 매출 전망 1억4,500만달러로 상향","summary":["실리콘 음극 배터리 업체 앰프리우스의 3분기 매출은 3,910만달러로 전년 대비 83%, 전 분기 대비 15% 늘어 분기 최대를 기록했다.","매출총이익률은 27%로 전년(15%)보다 높아졌고 순손실은 350만달러로 줄었으며, 미국 매출은 1,220만달러로 전 분기의 2.3배가 됐다.","회사는 2026년 매출 전망을 1억4,500만달러로 올렸고, 새 배터리 SiCore 500을 내놓았으며 2028년 미국 내 증산 계약 대상으로 선정됐다고 밝혔다."],"basis":"filing","related":[]},{"rank":3,"category":"earnings","category_ko":"실적·가이던스","id":"c352dc210573c1b0","title":"엔테그리스(ENTG): 8-K - Current report","url":"https://www.sec.gov/Archives/edgar/data/1101302/000114036126042892/0001140361-26-042892-index.htm","media":"SEC EDGAR","published_local":"2026-11-10 07:31 New_York","published_kst":"2026-11-10 21:31 KST","published_utc":"2026-11-10T12:31:30+00:00","paywall":false,"kind":"filing","tickers":["ENTG"],"names":["엔테그리스"],"sectors":["semi_equip"],"title_ko":"엔테그리스, 장기 매출 연평균 15% 성장 목표 제시…5억달러 자사주 매입·배당 10% 인상","summary":["엔테그리스는 자본시장의 날에서 장기 매출 연평균 성장률 목표를 약 15%로 제시했고, 이사회는 5억달러 규모 자사주 매입을 승인했다.","회사는 AI로 반도체 소자 구조가 복잡해지면서 고객의 소재 사용량과 오염 제어 요구가 늘고 있다고 성장 근거를 설명했다.","장기 목표는 조정 매출총이익률 약 55%, 조정 영업이익률 약 35%, 조정 EPS 연평균 약 30% 성장이며, 초과 현금의 약 50%를 환원하고 2027년 1분기부터 분기 배당을 10% 올릴 계획이다."],"basis":"filing","related":[]},{"rank":4,"category":"order_capex","category_ko":"수주·CAPEX","id":"354777b6c2ff186d","title":"[단독] 2.5조 실탄채운 LG화학…석화용지에 반도체소재공장 짓는다","url":"https://www.mk.co.kr/news/business/12204241","media":"매일경제","published_local":"2026-11-10 17:44 Seoul","published_kst":"2026-11-10 17:44 KST","published_utc":"2026-11-10T08:44:35+00:00","paywall":false,"kind":"news","tickers":["373220.KS","051910.KS"],"names":["LG에너지솔루션","LG화학"],"sectors":["battery_ev"],"title_ko":"LG화학, 여수 범용 석화 용지에 반도체 세정용 IPA 증설 검토…LG엔솔 지분 매각 자금 첫 투입","summary":["LG화학이 여수공장 네오펜틸글리콜(NPG) 공장 용지에 반도체 세정용 이소프로필알코올(IPA) 설비를 늘리는 수천억원 규모 투자를 검토 중이라고 매일경제가 업계를 인용해 보도했다.","NPG는 중국발 공급 과잉으로 수익성이 크게 떨어졌고, IPA는 웨이퍼 불순물 제거용 세정 소재로 삼성전자·SK하이닉스·TSMC 등에 공급된다.","세계 IPA 점유율 1위인 LG화학은 연 16만5,000t을 생산 중이며 수만t을 더 늘릴 계획이고, 지난달 LG에너지솔루션 지분 매각으로 확보한 2조5,000억원이 투입되는 첫 사업이다."],"basis":"body","related":[{"media":"매일경제","url":"https://www.mk.co.kr/news/business/12204238"},{"media":"매일경제","url":"https://www.mk.co.kr/news/business/12204007"}]},{"rank":5,"category":"other","category_ko":"기타","id":"e519cb8585e6d1ff","title":"BABA-W: PROPOSED SPIN-OFF AND SEPARATE LISTING OF T-HEAD ON THE MAIN BOARD OF THE STOCK EXCHANGE OF HONG KONG LIMITED","url":"https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1110/2026111001061.pdf","media":"HKEXnews","published_local":"2026-11-10 20:36 Hong_Kong","published_kst":"2026-11-10 21:36 KST","published_utc":"2026-11-10T12:36:00+00:00","paywall":false,"kind":"filing","tickers":["9988.HK"],"names":["알리바바"],"sectors":["internet"],"title_ko":"알리바바, 반도체 자회사 T-Head 홍콩 분할 상장 추진…비공개 상장 신청 공시","summary":["알리바바는 데이터센터 칩 자회사 T-Head(핑터우거)를 분할해 홍콩 메인보드에 상장하는 방안을 거래소가 승인해 진행할 수 있게 됐다고 공시했다.","T-Head는 9월 11일 비공개로 상장 신청서(Form A1)를 냈고, 홍콩 공모와 기관 배정으로 H주를 발행하며 상장 뒤에도 알리바바의 자회사로 남는다.","공모 규모·구조와 알리바바의 지분 감소 폭은 정해지지 않았고, 거래소는 기존 주주에게 T-Head 주식 우선 배정을 보장하는 요건의 면제를 허용했다."],"basis":"filing","related":[{"media":"SCMP","url":"https://www.scmp.com/business/companies/article/3373974/alibaba-chip-unit-t-head-files-hong-kong-ipo-plan-amid-chinas-ai-self-sufficiency-drive"},{"media":"WSJ","url":"https://www.wsj.com/tech/alibabas-chip-unit-files-for-hong-kong-listing-31f856cb"}]},{"rank":6,"category":"other","category_ko":"기타","id":"d496d4579fa48cb3","title":"Nvidia board member Stephen Neal could play big role in probe of CEO Jensen Huang","url":"https://www.cnbc.com/2026/11/09/nvidia-jensen-huang-investigation.html","media":"CNBC","published_local":"2026-11-10 15:22 New_York","published_kst":"2026-11-11 05:22 KST","published_utc":"2026-11-10T20:22:57+00:00","paywall":false,"kind":"news","tickers":["NVDA"],"names":["엔비디아"],"sectors":["semi_chip"],"title_ko":"엔비디아 황 CEO 조사, 이사회가 외부 법률 자문과 주도…FT \"월가 로펌 출신 전직 검사 선임\"","summary":["중국 스파이 의혹 인물과의 불륜을 둘러싼 젠슨 황 CEO 조사는 엔비디아 이사회가 외부 법률 자문의 도움을 받아 이끌고 있다.","CNBC는 쿨리 로펌 CEO 출신으로 수석 사외이사이자 지배구조 책임자인 스티븐 닐의 판단이 조사의 향방을 좌우할 수 있다고 전했다.","파이낸셜타임스는 엔비디아가 이 조사를 이끌 인물로 와크텔 로펌 소속 전직 미국 검사를 선임했다고 보도했다."],"basis":"body","related":[{"media":"Financial Times","url":"https://www.ft.com/content/8d59bf02-960e-4eb1-b5dc-55397e31cea5"},{"media":"WSJ","url":"https://www.wsj.com/tech/ai/how-jensen-huangs-affair-spiraled-into-a-national-security-nightmare-d9b43304"},{"media":"Bloomberg","url":"https://www.bloomberg.com/news/features/2026-11-10/la-crisis-de-nvidia-expone-su-dependencia-de-jensen-huang"},{"media":"매일경제","url":"https://www.mk.co.kr/news/business/12203837"}]},{"rank":7,"category":"other","category_ko":"기타","id":"b6f7b8c80262c267","title":"네이버도 마케팅비 절반으로 줄인다","url":"https://www.hankyung.com/article/2026111083181","media":"한국경제","published_local":"2026-11-10 17:38 Seoul","published_kst":"2026-11-10 17:38 KST","published_utc":"2026-11-10T08:38:40+00:00","paywall":false,"kind":"news","tickers":["035420.KS"],"names":["NAVER"],"sectors":["internet"],"title_ko":"네이버, 마케팅비 최대 절반 감축…1GW AI 팩토리 투자 재원 확보","summary":["네이버가 최근 전 사업 부문에 마케팅 비용 절감을 지시했고, 비용을 많이 쓰는 일부 부문에는 절반으로 줄이라고 주문했다.","2030년 초까지 1GW 규모 AI 팩토리를 짓기로 해 1단계 사업비만 약 100억달러(약 13조5,000억원)에 이르는 투자 재원을 마련하려는 조치다.","데이터센터 건설은 브룩필드가 맡지만 네이버는 GPU 사용료로 10조원 넘게 내야 하며, 이를 위해 네이버클라우드에 18조7,400억원의 지급 보증을 섰다."],"basis":"body","related":[]},{"rank":8,"category":"other","category_ko":"기타","id":"7ca0059299f1693a","title":"Rivian CEO says new R2 SUV, autonomy make 2027 an ‘inflection year’ as EV maker marks five years since IPO","url":"https://www.cnbc.com/2026/11/10/rivian-r2-autonomy-2027-rj-scaringe.html","media":"CNBC","published_local":"2026-11-10 10:11 New_York","published_kst":"2026-11-11 00:11 KST","published_utc":"2026-11-10T15:11:48+00:00","paywall":false,"kind":"news","tickers":["RIVN"],"names":["리비안"],"sectors":["battery_ev"],"title_ko":"리비안 CEO \"R2와 자율주행으로 2027년이 변곡점\"…3분기 인도 1만9,248대 46%↑","summary":["리비안의 RJ 스캐린지 CEO는 CNBC 인터뷰에서 중형 SUV R2와 자율주행 투자를 근거로 2027년이 회사의 변곡점이 될 것이라고 말했다.","3분기 인도량은 1만9,248대로 46% 늘었고 R2가 판매량 1위 모델이 됐으며, R2 비중 확대로 차량당 원가는 전 분기보다 1만2,000달러 넘게 개선됐다.","노멀 공장은 R2 최대 15만5,000대를 포함해 연 21만5,000대를 생산할 수 있고, 조지아 공장은 2028년 말 1단계 완공 뒤 연 30만대 규모가 된다."],"basis":"body","related":[{"media":"新浪财经","url":"https://finance.sina.com.cn/stock/usstock/c/2026-11-11/doc-iniyhser2350115.shtml"}]},{"rank":9,"category":"other","category_ko":"기타","id":"5b395142e86d4d83","title":"京东方Ａ: 京东方Ａ：股东权益变动的提示性公告","url":"https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-11-11/075b360e-9ce4-4d5a-afdd-87948057d658.PDF","media":"深圳证券交易所","published_local":"2026-11-11 00:00 Shanghai","published_kst":"2026-11-11 01:00 KST","published_utc":"2026-11-10T16:00:00+00:00","paywall":false,"kind":"filing","ti 전망치(2.3%, 2.5%)를 웃돌 것으로 예상했다."],"url":"https://www.bok.or.kr/portal/bbs/P0000559/view.do?nttId=11065823&menuNo=200690","type_ko":"통화","source":"한국은행"}],"econ_issues":[{"id":"2b3b65da9ac66095","title":"모건스탠리 '반도체 저승사자', 삼전닉스 30만9천원·160만원으로 하향","url":"https://www.yna.co.kr/view/AKR20261110080700008","media":"연합뉴스","published_local":"2026-11-10 11:30 Seoul","published_kst":"2026-11-10 11:30 KST","published_utc":"2026-11-10T02:30:02+00:00","paywall":false,"kind":"news","tickers":["005930.KS","000660.KS"],"names":["삼성전자","SK하이닉스"],"sectors":["semi_chip"],"title_ko":"모건스탠리, 삼성전자·SK하이닉스 목표가 19%·38% 하향…\"2028년 메모리 실적 절벽 우려\"","summary":["모건스탠리가 SK하이닉스 목표주가를 260만원에서 160만원으로, 삼성전자는 38만1,000원에서 30만9,000원으로 낮추면서도 내년 영업이익 전망은 각각 13%, 9% 올렸다.","2027년 말부터 신규 공장이 가동돼 공급이 늘고, 미국 중간선거 뒤 약 5GW 데이터센터가 2029년으로 미뤄져 2028년 신규 설비 증가율이 21%에서 9%로 낮아질 것으로 봤다.","투자의견은 두 종목 모두 비중 확대를 유지하고 최선호주를 삼성전기에서 삼성전자로 바꿨으며, 노무라는 공급 부족이 2028년까지 이어진다며 목표가를 유지해 시각이 갈렸다."],"basis":"body","related":[{"media":"매일경제","url":"https://www.mk.co.kr/news/stock/12204249"}]},{"id":"c1cb4bb2860cd981","title":"SoftBank swings to $7 billion loss after U.S. data center hit and Intel share decline","url":"https://www.cnbc.com/2026/11/10/softbank-2q-earnings-tech-selloff.html","media":"CNBC","published_local":"2026-11-10 04:01 New_York","published_kst":"2026-11-10 18:01 KST","published_utc":"2026-11-10T09:01:37+00:00","paywall":false,"kind":"news","tickers":["INTC"],"names":["인텔"],"sectors":["semi_chip"],"title_ko":"소프트뱅크, 2분기 순손실 1조1,200억엔…미국 AI 데이터센터 발전설비 조달 손실·인텔 주가 하락","summary":["소프트뱅크그룹이 회계연도 2분기에 1조1,200억엔(70억달러) 순손실을 냈다.","미국 AI 데이터센터용 발전설비 조달 계획 변경으로 상반기 5,972억엔 손실을 반영했고, 9월 말까지 발전설비에 낸 누적 대금은 94억8,000만달러다.","OpenAI 누적 투자는 546억달러(공정가치 996억달러)이며, 회사는 새 투자 유치에 따른 기업가치 상승분을 3분기에 반영할 수 있다고 밝혔다."],"basis":"body","related":[]},{"id":"a1db58051d26211a","title":"IBM将停止为美国咨询部门大部分岗位提供签证和绿卡担保","url":"https://finance.sina.com.cn/stock/usstock/c/2026-11-10/doc-iniyhmwu9121663.shtml","media":"新浪财经","published_local":"2026-11-10 23:37 Shanghai","published_kst":"2026-11-11 00:37 KST","published_utc":"2026-11-10T15:37:41+00:00","paywall":false,"kind":"news","tickers":["IBM"],"names":["IBM"],"sectors":["ai_sw"],"title_ko":"IBM, 미국 컨설팅 부문 대부분 직무에 비자·영주권 지원 중단","summary":["IBM이 트럼프 행정부의 전문직 취업비자 프로그램 강화에 따라 최대 사업부인 컨설팅 부문의 일부 직무에 대한 이민 보증을 중단한다.","해당 직원은 미국 밖에서 IBM 업무를 계속하거나 연말에 회사를 떠나야 하며, 컨설팅 부문 인력은 15만명이 넘는다.","행정부는 지난달 마이크로소프트·어도비 등 8개사가 미국 취업비자 프로그램을 남용했다며 이용 자격을 정지했다."],"basis":"body","related":[]}],"insights":[{"text":"엔테그리스는 AI로 소자 구조가 복잡해지며 소재 사용량이 늘어난다며 장기 매출 연평균 약 15% 성장과 영업이익률 약 35%를 목표로 제시했다.","refs":["https://www.sec.gov/Archives/edgar/data/1101302/000114036126042892/0001140361-26-042892-index.htm"]},{"text":"LG화학은 공급 과잉에 시달리는 범용 석화 용지를 반도체 세정용 IPA 증설에 쓰는 방안을 검토하고 있어, 화학사의 반도체 소재 전환이 구체화되고 있다.","refs":["https://www.mk.co.kr/news/business/12204241"]},{"text":"네이버는 1GW AI 팩토리의 GPU 사용료로 10조원 넘게 내야 해, 마케팅비를 최대 절반 줄이는 비용 통제로 투자 재원을 마련하고 있다.","refs":["https://www.hankyung.com/article/2026111083181"]},{"text":"소프트뱅크가 미국 AI 데이터센터용 발전설비를 미리 사 두다 손실을 낸 것은 전력이 AI 인프라 확장의 제약이 되고 있음을 보여준다.","refs":["https://www.cnbc.com/2026/11/10/softbank-2q-earnings-tech-selloff.html"]},{"text":"메모리 업황을 두고 모건스탠리는 2028년 공급 증가를, 노무라는 2028년까지의 공급 부족을 내다봐 외국계 증권사의 피크아웃 시각이 엇갈린다.","refs":["https://www.yna.co.kr/view/AKR20261110080700008","https://www.mk.co.kr/news/stock/12204249"]}],"judge":{"generated_at":"2026-11-11T09:26:43+09:00","warnings":["reserve: 한국 종목 이슈 4건 — 국가 필터 최소 5건 미달 (기준 충족 기사 부족)","reserve: 중국 종목 이슈 3건 — 국가 필터 최소 5건 미달 (기준 충족 기사 부족)","insights[5]: 근거 링크가 오늘 수록 항목에 없음: https://www.mk.co.kr/news/stock/12204249","headline[3]: 근거 링크가 오늘 수록 항목에 없음: https://www.mk.co.kr/news/stock/12204249","excluded: 판단 기록 없는 Core 후보 1건 (excluded에 사유를 남기면 로그가 정확해진다)"]},"sectors":[{"key":"ai_sw","name":"AI·클라우드·SW"},{"key":"semi_equip","name":"반도체 장비·소재"},{"key":"semi_chip","name":"반도체 칩"},{"key":"internet","name":"인터넷·플랫폼"},{"key":"hardware","name":"하드웨어·전자부품"},{"key":"battery_ev","name":"2차전지·EV"}],"built_at":"2026-11-12 14:13 KST","ref_date":"2026-11-11"}</script>
<script src="../dates.js"></script>

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("tm-data").textContent);
const S = D.sectors, SN = Object.fromEntries(S.map(s => [s.key, s.name]));
const BN = {KR:"한국", US:"미국", CN:"중국"};
const MK = {KR:"한국", US:"미국", CN:"중국", HK:"홍콩"};
const CK = {US:"미국", KR:"한국", CN:"중국", GLOBAL:"글로벌"};
const PER = ["1D","1W","1M","3M","6M","1Y","YTD"], PERL = {"1Y":"YoY"};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const href = u => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
const link = (u, t) => `<a href="${href(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`;
const cls = v => v == null ? "na" : v > 0 ? "up" : v < 0 ? "dn" : "flat";
const tri = v => v > 0 ? "▲" : v < 0 ? "▼" : "";
const pct = (v, d=2) => v == null ? '<span class="na">N/A</span>' : `<span class="${cls(v)}"><i class="tri">${tri(v)}</i>${Math.abs(v).toFixed(d)}</span>`;
const fnum = (v, d) => v == null ? "N/A" : v.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const mm = s => s ? s.slice(5, 10) : "―";
const empty = t => `<div class="empty">${esc(t)}</div>`;
const mcap = v => v == null ? '<span class="na">N/A</span>' : v >= 1000 ? `$${(v/1000).toFixed(2)}T` : `$${v.toFixed(v >= 100 ? 0 : 1)}B`;

/* header */
const M = D.market || null;
const bd = M ? M.base_dates : {};
$("hmeta").innerHTML = `기준일 ${esc(D.as_of)} 각 시장 직전 종가` + (M ? `<span class="mk"> (KR ${mm(bd.KR)} · US ${mm(bd.US)} · CN ${mm(bd.CN)} · HK ${mm(bd.HK)})</span>` : "") + ` · 업데이트 ${esc(D.built_at)}`;
const dates = (window.TM_DATES || [D.as_of]);
$("datesel").innerHTML = dates.map(d => `<option value="${esc(d)}"${d === D.as_of ? " selected" : ""}>${esc(d)}</option>`).join("");
$("datesel").onchange = e => { location.href = "" + e.target.value + ".html"; };

/* headline: 3문장, 제목 줄 오른쪽에 D-day(발행일) 발표 일정 */
const EVENTS = window.TM_EVENTS || [];
const evLink = e => `<span class="badge">${esc(CK[e.country] || e.country)}</span> ${e.source_url ? link(e.source_url, esc(e.name)) : esc(e.name)}`;
const dday = EVENTS.filter(e => e.date === D.ref_date);
const ddHtml = dday.length ? `<span class="dd"><span class="badge r">D-day</span>${dday.map(e => `<span>${evLink(e)}</span>`).join("")}</span>` : "";
const hl = D.headline || [];
if (hl.length || ddHtml) {
  $("headline").innerHTML = `<div class="card"><h3><span>오늘의 핵심</span>${ddHtml}</h3>` + (hl.length ? `<ol class="hl">` +
    hl.map(h => `<li>${esc(h.text)}${(h.refs||[]).map((u,i)=>`<a class="fn" href="${href(u)}" target="_blank" rel="noopener noreferrer">[${i+1}]</a>`).join("")}</li>`).join("") + `</ol>` : "") + `</div>`;
}

/* index strip */
const IDX_SHOW = ["KOSPI","KOSDAQ","SPX","NASDAQ","RUT","CSI300","SSE","HSI","HSTECH"];  // 과거 파일의 NYSE·SOX는 표시하지 않는다
function ixCard(i, small) {
  const g = ["1W","1M","3M","6M","1Y","YTD"].map(k => `<b>${PERL[k]||k}</b>`).slice(0,3).join("") +
    ["1W","1M","3M"].map(k => `<span>${pct(i.ret[k],1)}</span>`).join("") +
    ["6M","1Y","YTD"].map(k => `<b>${PERL[k]||k}</b>`).join("") + ["6M","1Y","YTD"].map(k => `<span>${pct(i.ret[k],1)}</span>`).join("");
  const st = i.stale ? ` <span class="flag" title="기준일 데이터 없음 — 마지막 거래 ${esc(i.last_date)}">⚠</span>` : "";
  return `<div class="ix${small?" small":""}"><div class="t"><span>${esc(i.name)}${st}</span><span class="num">${pct(i.ret["1D"])}</span></div>` +
    `<div class="c">${fnum(i.close, 2)}</div>` + (small ? "" : `<div class="g">${g}</div>`) + `<div class="d">${i.stale ? `종가 ${esc(i.last_date)} · 기준일 ${esc(i.base_date)} 데이터 없음` : `기준 ${esc(i.base_date || "N/A")}`}</div></div>`;
}
if (M) {
  const byKey = Object.fromEntries(M.indices.map(i => [i.key, i]));
  $("idx").innerHTML = `<div class="idx">${IDX_SHOW.filter(k => byKey[k]).map(k => ixCard(byKey[k])).join("")}</div>`;
} else $("idx").innerHTML = `<div class="card">${empty("시세 데이터 없음 (prices 단계 미실행)")}</div>`;

/* heat table */
let curSec = "all", curCty = "ALL", sortKey = "1D", sortDir = -1;
function heatCls(v, p) {  // 등락 크기를 4단계 색으로 (기간별 기준폭이 다르다)
  if (v == null) return "na";
  const r = Math.abs(v) / {"1D":4, "1W":8, "1M":15}[p];
  const lv = r < 0.1 ? 0 : r < 0.35 ? 1 : r < 0.65 ? 2 : r < 1 ? 3 : 4;
  return lv ? (v > 0 ? "u" : "d") + lv : "";
}
const paren = (v, d, u = "") => v < 0 ? `(${Math.abs(v).toFixed(d)}${u})` : v.toFixed(d) + u;  // 양수 0.0, 음수 (0.0)
function renderHeat() {
  if (!M) { $("heat").innerHTML = empty("데이터 없음"); return; }
  const P3 = ["1D","1W","1M"];
  let h = `<table class="heat"><thead><tr><th class="sc0" rowspan="2"></th>` +
    ["KR","US","CN"].map(b => `<th class="grp gs" colspan="3">${BN[b]}</th>`).join("") + `</tr><tr>` +
    ["KR","US","CN"].map(() => P3.map((p, j) => `<th class="${j===0?"gs":""}">${p}</th>`).join("")).join("") + `</tr></thead><tbody>`;
  for (const s of S) {
    const row = M.sector_matrix[s.key] || {};
    h += `<tr><td class="l">${esc(s.name)}</td>` +
      ["KR","US","CN"].map(b => P3.map((p, j) => {
        const v = row[b] ? row[b][p] : null;
        // 양수 뒤에 보이지 않는 ")"를 넣어 음수와 소수점 자리를 맞춘다
        return `<td class="num ${heatCls(v, p)}${j===0?" gs":""}" title="${esc(s.name)} · ${BN[b]} ${p} ${v == null ? "N/A" : paren(v, 2, "%")} · ${row[b] ? row[b].n : 0}종목">${v == null ? "N/A" : paren(v, 1) + (v < 0 ? "" : '<span class="ph">)</span>')}</td>`;
      }).join("")).join("") + `</tr>`;
  }
  $("heat").innerHTML = h + "</tbody></table>";
}

/* ranking */
const flagsBy = {};
if (M) for (const f of M.flags || []) (flagsBy[f.t] = flagsBy[f.t] || []).push(`${f.type}: ${f.detail}`);
const plusRows = (D.plus && D.plus.rows) || [];
const issuesBy = {};  // 티커 → 종목 이슈 툴팁 줄 ("1위 간략 제목"). 간략 제목은 "…" 앞의 핵심 구절
for (const a of (D.news && D.news.top10) || []) for (const t of a.tickers || []) (issuesBy[t] = issuesBy[t] || []).push(`${a.rank}위 ${(a.title_ko || "").split("…")[0].trim()}`);
function renderTabs() {
  const tabs = [["all", "전체"]].concat(S.map(s => [s.key, s.name]), [["plus", "Plus"]]);
  $("sectabs").innerHTML = tabs.map(([k, n]) => `<span class="tab${k === curSec ? " on" : ""}" data-k="${k}">${esc(n)}${k === "plus" ? `<span class="cnt">${plusRows.length}</span>` : ""}</span>`).join("");
  $("sectabs").querySelectorAll(".tab").forEach(t => t.onclick = () => { setSec(t.dataset.k); });
  $("ctyabs").innerHTML = [["ALL","통합"],["KR","한국"],["US","미국"],["CN","중국"]].map(([k, n]) => `<span class="tab${k === curCty ? " on" : ""}" data-k="${k}">${n}</span>`).join("");
  $("ctyabs").querySelectorAll(".tab").forEach(t => t.onclick = () => { curCty = t.dataset.k; renderAllRank(); });
}
function ctyLabel(r) { return r.bucket === "CN" && r.market === "US" ? "중국(美상장)" : (MK[r.market] || r.market); }
function sortVal(r, k) {
  if (PER.includes(k)) return r.ret ? r.ret[k] : null;
  return {n: r.n, t: r.t, cty: ctyLabel(r), close: r.close, mcap: r.mcap_usd_bn, sector: SN[r.sector], mult: r.multiple, since: r.since}[k];
}
const RANK_ALL_MAX = 10;
function renderRank() {
  const isPlus = curSec === "plus", isAll = curSec === "all";
  let rows = isPlus ? plusRows.map(r => ({...r, bucket: r.market === "HK" ? "CN" : r.market})) : (M ? M.stocks.filter(s => isAll || s.sector === curSec) : []);
  if (curCty !== "ALL") rows = rows.filter(r => r.bucket === curCty);
  if (sortKey) rows = rows.slice().sort((a, b) => {
    const x = sortVal(a, sortKey), y = sortVal(b, sortKey);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y, "ko") : x - y) * sortDir;
  });
  if (curCty === "ALL" || isAll) rows = rows.slice(0, RANK_ALL_MAX);  // 통합 보기와 전체 섹터 탭은 현재 정렬 기준 상위만
  const cols = [["#",null,"num"],["종목","n","l"],["티커","t","l"],["국가","cty","l"]]
    .concat(isPlus || isAll ? [["섹터","sector","l"]] : [])
    .concat([["종가","close","num"]]).concat(isPlus ? [["배수","mult","num"]] : [["시총","mcap","num"]])
    .concat(PER.map(p => [PERL[p] || p, p, "num"]))
    .concat(isPlus ? [["편입 사유",null,"l"],["편입일","since","num"]] : []);
  let h = `<table class="sortable"><thead><tr>` + cols.map(([n, k, c]) =>
    `<th class="${c === "l" ? "l" : ""}${k && k === sortKey ? " on" : ""}" ${k ? `data-k="${k}"` : ""}>${n}${k && k === sortKey ? (sortDir < 0 ? " ▼" : " ▲") : ""}</th>`).join("") + `</tr></thead><tbody>`;
  rows.forEach((r, i) => {
    const fl = flagsBy[r.t] ? `<span class="flag" title="${esc(flagsBy[r.t].join("\n"))}">⚠</span>` : "";
    const note = r.note ? `<span class="flag" title="${esc(r.note)}">ⓘ</span>` : "";
    const dec = (r.currency || (r.market === "KR" ? "KRW" : "")) === "KRW" ? 0 : 2;
    const name = issuesBy[r.t] ? `<span class="iss" title="${esc("종목 이슈\n" + issuesBy[r.t].join("\n"))}">${esc(r.n)}</span>` : esc(r.n);
    h += `<tr><td class="num">${i + 1}</td><td class="l">${name}${(r.tags||[]).length ? ` <span class="badge" title="태그 섹터">${r.tags.map(t => esc(SN[t] || t)).join("·")}</span>` : ""}</td>` +
      `<td class="l"><span class="tk">${esc(r.t)}</span>${fl}${note}</td><td class="l">${esc(ctyLabel(r))}</td>` +
      (isPlus || isAll ? `<td class="l"><span class="badge sec">${esc(SN[r.sector] || r.sector)}</span></td>` : "") +
      `<td class="num">${r.close == null ? '<span class="na">N/A</span>' : fnum(r.close, dec)}</td>` +
      (isPlus ? `<td class="num">${r.multiple == null ? '<span class="na">N/A</span>' : r.multiple.toFixed(2) + "x"}</td>` : `<td class="num">${mcap(r.mcap_usd_bn)}</td>`) +
      PER.map(p => `<td class="num">${pct(r.ret ? r.ret[p] : null)}</td>`).join("") +
      (isPlus ? `<td class="l" style="white-space:normal;min-width:220px">${esc(r.reason)}</td><td class="num">${esc(r.since)}</td>` : "") + `</tr>`;
  });
  if (!rows.length) h += `<tr><td colspan="${cols.length}" class="l">${isPlus ? "Plus 편입 종목 없음" : "해당 종목 없음"}</td></tr>`;
  $("rank").innerHTML = h + "</tbody></table>";
  $("rank").querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k; if (k === sortKey) sortDir *= -1; else { sortKey = k; sortDir = ["n","t","cty","sector"].includes(k) ? 1 : -1; } renderRank();
  });
}
function renderAllRank() { renderTabs(); renderRank(); }  // 섹터 표는 열람용이라 종목 순위와 연동하지 않는다
renderHeat();
function setSec(k) {
  // Plus는 규칙 순서(충족 조건 수 → 거래대금 배수)가 기본, 섹터 탭은 1D 내림차순이 기본
  if (k === "plus" && curSec !== "plus") { sortKey = null; sortDir = -1; }
  if (k !== "plus" && (curSec === "plus" || sortKey == null)) { sortKey = "1D"; sortDir = -1; }
  curSec = k; renderAllRank();
}
renderAllRank();

/* scorecard */
const MC = D.macro || null;
const UNIT = {bp:"bp", pp:"%p", pct:"%", abs:""};
const JC = {improve:"imp", worsen:"wor", neutral:"neu"};
function scVal(x) {
  if (x.value == null) return '<span class="na">N/A</span>';
  return esc(x.display || (x.value.toLocaleString("en-US", {maximumFractionDigits: 2}) + (x.unit === "%" ? "%" : "")));
}
const SC_MAX = 2;  // 섹터 표와 나란히 놓여 셀마다 대표 지표 + 보조 1개만 (config/scorecard.yaml 순서)
const SC_SHORT = {us_ffr:"FFR", us_2y:"2Y", us_10y:"10Y", kr_3y:"3Y", kr_10y:"10Y", cn_10y:"10Y", us_cpi:"CPI", us_pce:"PCE", kr_cpi:"CPI",
  cn_cpi:"CPI", cn_ppi:"PPI", us_gdp:"GDP", kr_gdp:"GDP", cn_gdp:"GDP", kr_export:"수출", kr_semi_export:"반도체수출", cn_ip:"산업생산", cn_retail:"소매판매",
  us_unrate:"실업률", kr_unrate:"실업률", cn_unrate:"실업률", us_nfp:"NFP", us_ism_mfg:"ISM제조", us_ism_svc:"ISM서비스", kr_ccsi:"소비심리", cn_pmi:"PMI",
  cn_rdpmi:"RatingDog", us_m2:"M2", kr_m2:"M2", cn_m2:"M2", cn_tsf:"사회융자", kr_usdkrw:"USD/KRW", us_dxy:"DXY", cn_usdcny:"CNY", cn_usdcnh:"CNH"};
function scItem(x) {  // 이름 값 방향. 기간·직전값·변화폭·발표일은 툴팁
  const chg = x.change == null ? null : `${x.change > 0 ? "+" : ""}${+(+x.change).toFixed(2)}${UNIT[x.change_unit] || ""}`;
  const tip = [x.name, x.period && `기간 ${x.period}`, chg && `변화 ${chg}`, x.prev != null && `직전 ${x.prev}${x.prev_period ? " (" + x.prev_period + ")" : ""}`,
    x.release_date && `발표 ${x.release_date}`, x.next_release && `다음 ${x.next_release}`, x.status !== "ok" && x.status && `상태 ${x.status}`]
    .filter(Boolean).join(" · ");
  const label = esc(SC_SHORT[x.key] || x.name || x.key);
  const nm = x.source_url ? link(x.source_url, label) : `<span class="nm">${label}</span>`;
  return `<span class="ci" title="${esc(tip)}">${nm}<span class="v">${scVal(x)}</span>${x.arrow ? `<span class="ar ${JC[x.judge] || ""}">${esc(x.arrow)}</span>` : ""}</span>`;
}
if (MC) {
  let h = `<table class="sc"><thead><tr><th class="rowh"></th><th class="l">한국</th><th class="l">미국</th><th class="l">중국</th></tr></thead><tbody>`;
  for (const r of MC.scorecard) {
    h += `<tr><td class="l rowh">${esc(r.name)}</td>` + ["KR","US","CN"].map(c => {
      const x = r.cells[c] || {}, items = (x.items || [x]).slice(0, SC_MAX);
      return `<td class="${x.judge === "improve" ? "imp" : x.judge === "worsen" ? "wor" : ""}">${items.map(scItem).join("")}</td>`;
    }).join("") + `</tr>`;
  }
  $("score").innerHTML = h + "</tbody></table>";
} else { $("score").innerHTML = empty("매크로 데이터 없음"); }

/* policy / insights / econ */
const sumLines = arr => `<div class="sm">${(arr || []).map(s => `<div>${esc(s)}</div>`).join("")}</div>`;  // 번호 없이 줄 단위
const SHOW_MAX = 5;  // 정책 트래커·경제 이슈: 중요도 순(판단 파일 배열 순서) 앞에서 5건까지
const POLICY_FROM = new Date(Date.parse(D.as_of + "T00:00:00Z") - 7 * 864e5).toISOString().slice(0, 10);  // 기준일 7일 전부터
const recentPolicy = (D.policy || []).filter(p => p.date >= POLICY_FROM).slice(0, SHOW_MAX);
const policyItem = p =>
  `<div class="item"><div class="h"><span><b>${esc(p.title)}</b> <span class="badge">${esc(p.type_ko)}</span></span><span class="src">${esc(p.date)} · ${esc(CK[p.country] || p.country)} · ${link(p.url, "원문")}</span></div>` +
  sumLines(p.summary) + `</div>`;
$("policy").innerHTML = recentPolicy.length ? recentPolicy.map(policyItem).join("") : empty("최근 1주일 정책 발표 없음");
$("insights").innerHTML = (D.insights || []).length ? `<ol class="hl">` + D.insights.map(x =>
  `<li>${esc(x.text)}${(x.refs || []).map((u, i) => `<a class="fn" href="${href(u)}" target="_blank" rel="noopener noreferrer">[${i + 1}]</a>`).join("")}</li>`).join("") + `</ol>` : empty("판단 데이터 없음");
const pub = a => `${esc(a.media)} · <span title="${esc(a.published_local)}">${esc((a.published_kst || "").replace(" KST", ""))} KST</span> · ${link(a.url, "원문")}`;
const econItem = a => `<div class="item"><div class="h"><b>${esc(a.title_ko)}</b><span class="src">${pub(a)}</span></div>${sumLines(a.summary)}</div>`;
$("econ").innerHTML = (D.econ_issues || []).length ? D.econ_issues.slice(0, SHOW_MAX).map(econItem).join("") : empty("판단 데이터 없음");

/* news */
let nC = "ALL";
const tkBucket = {}, stockBy = {};
if (M) for (const s of M.stocks) { tkBucket[s.t] = s.bucket; stockBy[s.t] = s; }
for (const r of plusRows) { tkBucket[r.t] = r.market === "HK" ? "CN" : r.market; stockBy[r.t] = stockBy[r.t] || r; }
const bucketOf = t => tkBucket[t] || (/\.(KS|KQ)$/.test(t) ? "KR" : /\.(SS|SZ|HK)$/.test(t) ? "CN" : "US");
function stockChip(a, past) {  // 대표 종목(첫 티커) 1개: 종목명·1D, 국가. 티커 전체와 기준일은 툴팁. 아카이브(past)는 1D를 빼고 이름만
  const ts = a.tickers || [];
  if (!ts.length) return "";
  const s = stockBy[ts[0]], d1 = s && s.ret ? s.ret["1D"] : null;
  const name = (s && s.n) || (a.names || [])[0] || ts[0];
  const cty = s ? ctyLabel(s) : (BN[bucketOf(ts[0])] || "");
  const tip = `티커 ${ts.join(", ")}` + (!past && s && s.base_date ? ` · 1D 기준일 ${s.base_date}` : "");
  const ret = past ? "" : ` <span class="num">${pct(d1)}${d1 == null ? "" : "%"}</span>`;
  return `<span class="stk" title="${esc(tip)}"><b>${esc(name)}</b>${ret}</span> <span class="badge">${esc(cty)}</span>`;
}
function newsItem(a, rk, past) {
  const rep = stockBy[(a.tickers || [])[0]];  // 섹터도 대표 종목 기준
  const secs = (rep && rep.sector ? [rep.sector] : a.sectors || []).map(s => `<span class="badge sec">${esc(SN[s] || s)}</span>`).join(" ");
  const rel = (a.related || []).length ? `<div class="rel">관련: ${a.related.map(r => link(r.url, esc(r.media))).join(" · ")}</div>` : "";
  return `<div class="it"><div class="rk">${rk}</div><div><div class="l1"><span class="tt">${esc(a.title_ko)}${stockChip(a, past)} ${secs}</span><span class="src">${pub(a)}</span></div>` +
    `<div class="l2">${(a.summary || []).map(s => `<div>${esc(s)}</div>`).join("")}</div><div class="orig" title="원문 제목">${esc(a.title)}</div>${rel}</div></div>`;
}
const ctyIs = (a, c) => c === "ALL" || (a.tickers || []).some(t => bucketOf(t) === c);
const newsPass = a => ctyIs(a, nC);
const NEWS_COUNTRY_MIN = 5;  // 국가 필터: Top 10에 그 국가가 5건 미만이면 국가별 보충(reserve)에서 중요도 순으로 채운다
function renderNews() {
  $("nfc").innerHTML = [["ALL","전체"],["KR","한국"],["US","미국"],["CN","중국"]].map(([k, n]) => `<span class="tab${k === nC ? " on" : ""}" data-k="${k}">${n}</span>`).join("");
  $("nfc").querySelectorAll(".tab").forEach(t => t.onclick = () => { nC = t.dataset.k; renderNews(); });
  let top = ((D.news && D.news.top10) || []).filter(newsPass);
  if (nC !== "ALL" && top.length < NEWS_COUNTRY_MIN)
    top = top.concat(((D.news && D.news.reserve) || []).filter(newsPass).slice(0, NEWS_COUNTRY_MIN - top.length));
  $("top10").innerHTML = D.news ? (top.length ? top.map(a => newsItem(a, a.rank)).join("") : empty("필터에 맞는 기사 없음")) : empty("판단 데이터 없음");
}
renderNews();

/* more: 섹션별 아카이브 (site/issues.js = 모든 날짜를 최신순으로 모은 것). 종목·경제 이슈는 기준일별로 묶는다 */
const ISS = window.TM_ISSUES || {policy: [], econ: [], stock: []};
const MORE = {policy: "정책 트래커", econ: "경제 이슈", stock: "종목 이슈"};
let mC = "ALL";
function renderMore(kind) {
  $("moretitle").textContent = MORE[kind];
  const ctys = kind === "econ" ? [] : [["ALL","전체"],["KR","한국"],["US","미국"],["CN","중국"]];
  $("mfc").innerHTML = ctys.map(([k, n]) => `<span class="tab${k === mC ? " on" : ""}" data-k="${k}">${n}</span>`).join("");
  $("mfc").querySelectorAll(".tab").forEach(t => t.onclick = () => { mC = t.dataset.k; renderMore(kind); });
  const pass = kind === "stock" ? a => ctyIs(a, mC) : kind === "policy" ? p => mC === "ALL" || p.country === mC : () => true;
  const rows = (ISS[kind] || []).filter(pass);
  let h = "", cur = null;
  for (const a of rows) {
    if (kind !== "policy" && a.as_of !== cur) { cur = a.as_of; h += `<div class="grp-d">${esc(cur)}</div>`; }
    h += kind === "policy" ? policyItem(a) : kind === "econ" ? econItem(a) : newsItem(a, a.rank, true);
  }
  $("morebox").className = "card" + (kind === "stock" ? " news" : " rows");
  $("morebox").innerHTML = h || empty("아카이브된 항목 없음");
}

/* footer */
const w = (D.judge && D.judge.warnings) || [];
$("foot").innerHTML = `데이터 기준일 ${esc(D.as_of)} · 빌드 ${esc(D.built_at)} · 출처는 각 항목의 원문 링크 · 투자 권유가 아닌 개인 스터디용` +
  (M && (M.errors || []).length ? ` · 시세 오류 ${M.errors.length}건` : "") + (w.length ? ` · 판단 경고 ${w.length}건` : "");

/* Calendar: 데이터가 있는 날짜마다 그 날짜의 Main·News로 이동, 지표 발표 일정 표시 */
const hasNews = d => !(window.TM_NO_NEWS || []).includes(d);
const calDates = dates.slice().sort();
const ym = d => +d.slice(0, 4) * 12 + (+d.slice(5, 7) - 1);
const calYms = calDates.concat(EVENTS.map(e => e.date)).map(ym);
const ymMin = Math.min(...calYms), ymMax = Math.max(...calYms);
let calYm = ym(D.as_of);
const p2 = n => String(n).padStart(2, "0");
function renderCalendar() {
  const y = Math.floor(calYm / 12), m = calYm % 12;
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let h = `<div class="calhd"><button id="calprev"${calYm <= ymMin ? " disabled" : ""}>◀</button><span>${y}년 ${m + 1}월</span><button id="calnext"${calYm >= ymMax ? " disabled" : ""}>▶</button></div><div class="cg">` +
    ["일","월","화","수","목","금","토"].map(w => `<div class="dw">${w}</div>`).join("") + `<div class="off"></div>`.repeat(first);
  for (let i = 1; i <= days; i++) {
    const d = `${y}-${p2(m + 1)}-${p2(i)}`, has = calDates.includes(d);
    const base = "" + d + ".html";
    h += `<div class="${has ? "has" : ""}${d === D.as_of ? " cur" : ""}"><span class="dn-day">${i}</span>` +
      (has ? `<div class="lk"><a href="${base}#main">Main</a>${hasNews(d) ? `<a href="${base}#news">News</a>` : "<span>News 없음</span>"}</div>` : "") +
      EVENTS.filter(e => e.date === d).map(e => `<div class="ev">${evLink(e)}</div>`).join("") + `</div>`;
  }
  $("calbox").innerHTML = h + `<div class="off"></div>`.repeat((7 - (first + days) % 7) % 7) + "</div>";
  $("calprev").onclick = () => { calYm--; renderCalendar(); };
  $("calnext").onclick = () => { calYm++; renderCalendar(); };
}
renderCalendar();

/* 화면 전환: #calendar면 달력만, #more-<섹션>이면 그 섹션 아카이브만, 그 외에는 Main·News 스크롤 화면 */
const secs = ["main","news"].map(id => $(id)), navs = [...document.querySelectorAll("#nav a")];
const isCal = () => location.hash === "#calendar";
const moreKind = () => (location.hash.match(/^#more-(policy|econ|stock)$/) || [])[1];
function markNav(cur) { navs.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur)); }
function spy() {
  if (isCal()) return markNav("calendar");
  if (moreKind()) return markNav("news");
  let cur = "main";
  for (const s of secs) if (s.getBoundingClientRect().top <= 80) cur = s.id;
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) cur = "news";
  markNav(cur);
}
let wasCal = false;
function applyView(first) {
  const kind = moreKind(), cal = isCal() || !!kind;  // cal = 본문 대신 별도 화면
  secs.forEach(s => s.hidden = cal);
  $("calendar").hidden = !isCal();
  $("more").hidden = !kind;
  if (kind) { mC = "ALL"; renderMore(kind); }
  if (cal) window.scrollTo({top: 0, behavior: "instant"});
  else if ((first || wasCal) && /^#(main|news)$/.test(location.hash)) {
    // 화면을 스크립트로 그리거나 숨김을 푼 직후라 브라우저의 앵커 이동이 어긋난다 → 위치를 다시 맞춘다
    $(location.hash.slice(1)).scrollIntoView({behavior: "instant"});
  }
  wasCal = cal;
  spy();
}
if (new URLSearchParams(location.search).has("pdf")) {  // PDF 저장용: 카드는 화면 기본(펼침·나란히), 종목 순위 전체/통합
  curCty = "ALL";
  setSec("all");
}
addEventListener("scroll", spy, {passive: true});
addEventListener("hashchange", () => applyView(false));
applyView(true);
})();
</script>
</body>
</html>
